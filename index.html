<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card" aria-labelledby="titulo">
    <div class="marca"><img src="img/banner-terra.jpg" alt="Terra – conectado por Vivo Fibra" width="447" height="170"></div>
    <h1 id="titulo">Entrar</h1>

    <div id="mensagem" class="alerta" role="alert" aria-live="polite" hidden></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" inputmode="tel"
               autocomplete="tel" placeholder="(11) 99999-9999" required>
        <small class="ajuda">Com DDD. Para outros países, use o formato +código do país.</small>
        <span class="erro-campo" id="erro-telefone" hidden></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password"
               autocomplete="current-password" required>
        <span class="erro-campo" id="erro-senha" hidden></span>
      </div>

      <button type="submit" id="btn-entrar" class="btn">
        <span class="btn-texto">Entrar</span>
        <span class="spinner" aria-hidden="true" hidden></span>
      </button>
    </form>

    <p class="links">
      Não tem uma conta?<a href="cadastro.html">Criar conta</a>
    </p>
    <!--
      "Esqueci minha senha" foi omitido de propósito: com a arquitetura atual
      (e-mail sintético derivado do telefone) não existe um fluxo de recuperação
      seguro. Veja a seção "Recuperação de senha" no README.md.
    -->
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
