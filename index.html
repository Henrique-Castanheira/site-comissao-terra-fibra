<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Botão para abrir o Modal -->
  <button type="button" class="btn-contato" onclick="abrirModalContato()">
    Abrir Formulário / Contato
  </button>

  <!-- Modal -->
  <div id="modalContato" class="modal-contato-overlay" style="display: none;">
    <div class="modal-contato-content">
      <span class="fechar-modal" onclick="fecharModalContato()">&times;</span>
      <h3>Informações de Contato e Valor</h3>
      <hr />

      <form id="formContato" onsubmit="enviarFormulario(event)">
        <!-- Campo de Telefone -->
        <div class="form-group">
          <label for="telefone">Telefone / WhatsApp:</label>
          <input 
            type="tel" 
            id="telefone" 
            name="telefone" 
            placeholder="(19) 99999-9999" 
            maxlength="15" 
            required 
            oninput="mascaraTelefone(this)"
          />
          <small id="erroTelefone" class="msg-erro" style="display: none;">
            Digite o número completo com DDD (11 dígitos).
          </small>
        </div>

        <!-- Campo de Valor (R$) -->
        <div class="form-group">
          <label for="valor">Valor da Comissão / Plano:</label>
          <input 
            type="text" 
            id="valor" 
            name="valor" 
            placeholder="R$ 0,00" 
            required 
            oninput="mascaraMoeda(this)"
          />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-salvar">Enviar / Salvar</button>
          <button type="button" class="btn-fechar" onclick="fecharModalContato()">Cancelar</button>
        </div>
      </form>

    </div>
  </div>

  <script src="js/ui.js"></script>
</body>
</html>
